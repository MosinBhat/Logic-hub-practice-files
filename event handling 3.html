<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial, Helvetica, sans-serif;
            color: brown;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <input type="text" id="inputTxt">
    <p id="outputTxt"></p>
    


    <script>

        let inputTxt = document.querySelector("#inputTxt");
        inputTxt.addEventListener("input", (event) => document.querySelector("#outputTxt").innerText = event.target.value);
    

    </script>
</body>
</html>
