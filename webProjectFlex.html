<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        }
        :root{
            font-size: 16px;
        }

        .main-container{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: row wrap;
            background-color: antiquewhite;

        }
        #logo-div{
            height: 15%;
            flex-basis: 15%;
            background-image: url("Copilot_20260716_203021.png");
            background-size: cover;
            background-position: center;

        }
        #search-div{
            height: 15%;
            flex-basis: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #search-div>input{
            padding: 10px 50px;
            border: 2px solid purple;
            border-radius: 10px;
            background-color: white;
            
        }
        #search-div>button{
            /* width: 20%; */
            padding: 10px;
            border: 2px solid purple;
            background-color: white;
            border-radius: 10px;
            box-shadow: 2px 2px 4px grey;

        }
        #menu-div{
            height: 15%;
            flex-basis: 50%;
            /* border-width: 0 0 5px 5px;
            border-color: black;
            border-style: groove; */
            
        }
        #menu-div>ul{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            list-style: none;
            justify-content: space-around;
            align-items: center;
        }
        #menu-div>ul>li>button{
            padding: 10px;
            border: 2px solid purple;
            background-color: purple;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.3rem;
            color: white;
            box-shadow: 2px 2px 4px grey;

        }
        
        #side-div{
            height: 85%;
            flex-basis: 15%;
        }
        #side-div>ul{
            width: 100%;
            height: 100%;
            display: flex;
            list-style: none;
            align-items:center;
            flex-wrap: wrap;

        }
        #side-div>ul>li{
            width: 100%;
            height: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #side-div>ul>li>button{
            width: 90%;
            height: 100%;
            font-size: 2.0rem;
            background-color: purple;
            border-radius: 50%;
            border: 2px solid purple;
            color: white;
            box-shadow: 2px 2px 4px grey;

        }
        #content-div{
            height: 85%;
            flex-basis: 85%;
            padding: 50px;
            background-color: white;
            overflow: auto;
            text-align: justify;
            color: purple;
            box-shadow: inset 0 0 10px gray;
            
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="main-item" id="logo-div"></div>
        <div class="main-item" id="search-div">
            <input type="text" placeholder="Search......">
            <button>Search</button>
        </div>
        <div class="main-item" id="menu-div">
            <ul>
                <li><button>Home</button></li>
                <li><button>Contact</button></li>
                <li><button>Login</button></li>
                <li><button>About us</button></li>
            </ul>
        </div>
        <div class="main-item" id="side-div">
            <ul>
                <li><button onclick="latest()">Latest</button></li>
                <li><button onclick="Popular()">Popular</button></li>
                <li><button onclick="Trending()">Trending</button></li>
                <li><button onclick="Important()">Important</button></li>
            </ul>
        </div>
        <div class="main-item" id="content-div"></div>
    </div>
