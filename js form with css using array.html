<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .container{
            width: 50%;
            margin: 0 auto;
            padding: 0;
            background-color: antiquewhite;
            border: 2px solid black;
        }
        .input-group{
            padding: 5px 10px;
        }
        .input-group>label{
            font-size: 1.4rem;
        }
        .input-group>p{
            font-size: 1.5rem;
            color: blue;
        }
        .input-control{
            width: 95%;
            height: 30px;
            border-radius: 5px;

        }
        .btn{
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            width: 96%;
            height: 40px;
            border-radius: 10px;
            background-color: bisque;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="input-group">
            <label for="txtName">Name</label>
            <br>
            <input type="text" class="input-control">
            <p></p>
        </div>
        <div class="input-group">
            <label for="txtContact">Contact</label>
            <br>
            <input type="text" class="input-control">
            <p></p>
        </div>
        <div class="input-group">
            <label for="txtEmail">Email</label>
            <br>
            <input type="text" class="input-control">
            <p></p>
        </div>
        <div class="input-group">
            <label for="txtAddress">Address</label>
            <br>
            <input type="text" class="input-control">
            <p></p>
        </div>
        <div class="input-group">
            <label for="txtCountry">Country</label>
            <br>
            <input type="text" class="input-control">
            <p></p>
        </div>
        <div class="input-group">
            <button class="btn" onclick="showData()">Signup</button>
        </div>

    </div>



    <script>

        function showData(){
            let input = document.querySelectorAll(".input-control");
            let para = document.querySelectorAll(".input-group>p");


            for(let i = 0; i<input.length; i++){
                
                para[i].innerText = input[i].value;

            }


        }

    </script>
    
</body>
</html>
