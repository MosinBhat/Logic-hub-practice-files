<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #parent{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        #child{
            width: 400px;
            height: 400px;
            border: 2px ridge rgb(182, 58, 78);
            display: inherit;
            justify-content: inherit;
            align-items: inherit;
            transition: 600ms ease-in-out all 0s;

        }
        #child:hover{
            transform: rotate(360deg) scale(1.3);
            border-radius: 50%;
            font-size: 1.5rem;
            color: green;
            background-color: gainsboro;
            border: 5px solid green;
            box-shadow: 4px 4px 5px grey;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="child">
            Logic Hub Software Solution
        </div>
    </div>

    
    






    <script>

        let num = 1;
         while(num <=5){
            console.log(num)
            num++
         }

    </script>
</body>
</html>
